name: Build and publish Caddy WebDAV image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: caddy-webdav
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Caddy and WebDAV versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          CADDY_TAG=$(
            git ls-remote --tags --refs https://github.com/caddyserver/caddy.git               | awk '{sub("refs/tags/", "", $2); print $2}'               | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'               | sort -V               | tail -n 1
          )

          if [ -z "$CADDY_TAG" ]; then
            echo "Konnte aktuelle stabile Caddy-Version nicht ermitteln."
            exit 1
          fi

          CADDY_VERSION="${CADDY_TAG#v}"

          WEBDAV_VERSION=$(
            git ls-remote https://github.com/mholt/caddy-webdav.git HEAD               | awk 'NR == 1 {print $1}'
          )

          if ! [[ "$WEBDAV_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Konnte aktuellen caddy-webdav-Commit nicht ermitteln."
            exit 1
          fi

          WEBDAV_SHORT="${WEBDAV_VERSION:0:12}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${CADDY_VERSION}-webdav-${WEBDAV_SHORT}"

          echo "Caddy:          ${CADDY_VERSION}"
          echo "caddy-webdav:   ${WEBDAV_VERSION}"
          echo "Image:          ${IMAGE}:${IMAGE_TAG}"

          echo "caddy_version=${CADDY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "webdav_version=${WEBDAV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "webdav_short=${WEBDAV_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: image_exists
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.versions.outputs.image }}"
          IMAGE_TAG="${{ steps.versions.outputs.image_tag }}"

          echo "Prüfe ${IMAGE}:${IMAGE_TAG} ..."

          if docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Image existiert bereits -> überspringe Build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image existiert noch nicht -> baue."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.image_exists.outputs.skip_build != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.versions.outputs.caddy_version }}
            WEBDAV_VERSION=${{ steps.versions.outputs.webdav_version }}
          tags: |
            ${{ steps.versions.outputs.image }}:latest
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.image_tag }}
            org.opencontainers.image.description=Caddy with mholt/caddy-webdav
            
